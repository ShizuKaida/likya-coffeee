<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" href="%PUBLIC_URL%/Likya-Turuncu-Logo.png" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="canonical" href="https://likyacoffee.com/" />

    <!-- Primary SEO -->
    <title>Likya Coffee</title>
    <meta
      name="description"
      content="Likya Coffee — taze çekirdek kahveler, imza tatlar ve samimi bir ortam. Menümüzü keşfedin, QR menüye göz atın ve bize uğrayın."
    />
    <meta
      name="keywords"
      content="Likya Coffee, Likya, Likya kafe, kafe,kahveci,likya coffee kahve, üçüncü nesil kahve, espresso, latte, cappuccino, soğuk kahve, Türk kahvesi, kafe"
    />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:site_name" content="Likya Coffee" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Likya Coffee" />
    <meta
      property="og:description"
      content="Taze çekirdek kahveler, eşsiz tatlar ve samimi bir ortam."
    />
    <meta property="og:url" content="https://likyacoffee.com/" />
    <meta
      property="og:image"
      content="https://likyacoffee.com/Likya-Turuncu-Logo.png"
    />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Likya Coffee" />
    <meta
      name="twitter:description"
      content="Taze çekirdek kahveler, eşsiz tatlar ve samimi bir ortam."
    />
    <meta
      name="twitter:image"
      content="https://likyacoffee.com/Likya-Turuncu-Logo.png"
    />

    <meta name="robots" content="index, follow" />
